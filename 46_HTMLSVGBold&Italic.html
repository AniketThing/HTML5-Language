<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Bold & Italic</title>
</head>
<body>
    <p><b>This is SVG Bold Text :</b></p>
    <svg height="100" width="300">
        <text x="20" y="60" font-size="40" fill="skyblue" font-weight="Bold">Hello , Aniket!!</text>
    </svg>
    <p><b>This is SVG Italic Text :</b></p>
    <svg height="100" width="300">
        <text x="20" y="60" font-size="40" fill="skyblue" stroke="gray" stroke-weight="1" font-style="italic">Hello , Aniket!!</text>
    </svg>
</body>
</html>
