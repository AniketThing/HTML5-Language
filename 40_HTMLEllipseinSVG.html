<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ellipse SVG</title>
</head>
<body>
    <p><b>This is Ellipse1 :</b></p>
        <svg>
            <ellipse cx="100" cy="100" rx="80" ry="40" fill="skyblue">
        </svg>
        <br>
        <br>
            <p><b>This is Ellipse2 :</b></p>
        <svg>
            <ellipse cx="100" cy="100" rx="80" ry="40" fill="skyblue" stroke="black">
        </svg>
        <br>
        <br>
                    <p><b>This is Ellipse3 :</b></p>
        <svg>
            <ellipse cx="100" cy="100" rx="80" ry="40" fill="skyblue" stroke="black" stroke-width="2">       
         </svg>
         <br>
         <br>
         <p><b>This is Ellipse4 :</b></p>
        <svg>
            <ellipse cx="100" cy="100" rx="80" ry="40" fill="skyblue" stroke="black" stroke-width="2" stroke-dasharray="10,3">       
         </svg>
</body>
</html>
