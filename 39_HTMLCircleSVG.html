<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle SVG</title>
</head>
<body>
    <p><b>This is the Circle1 :</b></p>
    <svg>
        <circle cx="100" cy="100" r="40" fill="black">
    </svg>
    <br>
    <br>
    <p><b>This is the Circle2 :</b></p>
    <svg>
        <circle cx="100" cy="100" r="40" fill="black" stroke="green">
    </svg>
    <br> 
    <br>
    <p><b>This is the Circle3 :</b></p>
    <svg>
        <circle cx="100" cy="100" r="40" fill="black" stroke="green" stroke-width="2">
    </svg>
    <br> 
    <br>
    <p><b>This is the Circle4 :</b></p>
    <svg>
        <circle cx="100" cy="100" r="40" fill="black" stroke="green" stroke-width="2" stroke-dasharray="10,5">
    </svg>
</body>
</html>
