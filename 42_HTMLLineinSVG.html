<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line SVG</title>
</head>
<body>
    <p><b>This is Line1 :</b></p>
    <svg width="200" height="200"> 
        <line x1="10" y1="0" x2="100" y2="0" stroke="black">
    </svg>
    <p><b>This is Line2 :</b></p>
    <svg width="200" height="200"> 
        <line x1="10" y1="0" x2="100" y2="0" stroke="black" stroke-width="2">
    </svg>
    <p><b>This is Line3 :</b></p>
    <svg width="200" height="200"> 
        <line x1="10" y1="0" x2="100" y2="0" stroke="black" stroke-width="2" stroke-dasharray="10,4">
    </svg>
</body>
</html>
