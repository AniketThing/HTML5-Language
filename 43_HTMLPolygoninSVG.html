<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygon SVG</title>
</head>
<body>
    <p><b>This is Polygon1 :</b></p>
    <svg width="200" height="200">
        <polygon points="50,150 150,150 100,50" fill="skyblue">
    </svg>
    <p><b>This is Polygon2 :</b></p>
    <svg width="200" height="200">
        <polygon points="50,150 150,150 100,50" fill="skyblue" stroke="black">
    </svg>
    <p><b>This is Polygon3 :</b></p>
    <svg width="200" height="200">
        <polygon points="50,150 150,150 100,50" fill="skyblue" stroke="black" stroke-width="2">
    </svg>
    <p><b>This is Polygon4 :</b></p>
    <svg width="200" height="200">
        <polygon points="50,150 150,150 100,50" fill="skyblue" stroke="black" stroke-width="2" stroke-dasharray="10,6">
    </svg>
</body>
</html>
