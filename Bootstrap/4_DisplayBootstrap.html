<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Example Bottstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style type="text/css">
        h1{
            color: blueviolet;
            text-align: center;
        }
        .blockcontainer span{
            width: 100px;
            height: 50px;
            background-color: aqua;
            border: 1px solid black;
        }
        .A span{
            width: 100px;
            height: 50px;
            background-color: aqua;
            border: 1px solid black;
        }
        .inlinecontainer div{
            width: 100px;
            height: 50px;
            background-color:lightgreen;
            border: 1px solid black;
        }
        .DFlex div{
            width: 100px;
            height: 50px;
            background-color:cadetblue;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Example of Dispaly Property in Bootstrap</h1>
    </div>
    <div>
        <div class="A">
        <span>SPAN 1</span>
        <span>SPAN 2</span>
        <span>SPAN 3</span>
    </div>
    </div>
    <br>
    <br>
    <hr>
    <div class="blockcontainer">
    <h2>Dispaly d-Block property</h2><br>
        <span class="d-block">SPAN 1</span>
        <span class="d-block">SPAN 2</span>
        <span class="d-block">SPAN 3</span>
    </div>
    <br>
    <br>
    <hr>
    <div class="inlinecontainer">
    <h2>Dispaly d-inline property</h2><br>
        <div class="d-inline">SPAN 1</div>
        <div class="d-inline">SPAN 2</div>
        <div class="d-inline">SPAN 3</div>
    </div>
    <br>
    <br>
    <hr>
    <div class="DFlex d-flex">
    <h2>Dispaly DFlex property</h2><br>
        <div>SPAN 1</div>
        <div>SPAN 2</div>
        <div>SPAN 3</div>
    </div>
    <br>
    <br>
    <hr>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
