<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <style type="text/css">
        h1{
            text-align: center;
            color: chocolate;
        }
        h3{
            color: darkgreen;
        }
    </style>
</head>
<body>
    <h1>Progress Bar in bootstrap</h1>
    <br><br>
<div class="container">
    <h3>1. Progress Bar:</h3>
    <div class="progress">
        <div class="progress-bar" role="loading" style="width:45%" ></div>
    </div>
    <br>
      <div class="progress">
      <div class="progress-bar"role="progressbar" style="width:45%" aria-valuemin="0"aria-valuemax="100" aria-valuenow="45"> </div>
    </div>
    <br><br>

    <h3>2. Progress Bar with Lables:</h3>
    <div class="progress">
        <div class="progress-bar" role="loading" style="width:71%" aria-valuemin="0"aria-valuemax="100" aria-valuenow="71%">71%</div>
    </div><br>
    <br><br>
    <h3>3. Progress Bar with Height:</h3>
       <div class="progress" style="height: 1px;">
           <div class="progress-bar" role="progressbar" style="width:71%;"></div>
       </div>
       <br>
       <div class="progress" style="height: 20px;">
           <div class="progress-bar" role="progressbar" style="width:71%;">71% </div></div>
       <br><br>
       <h3>4. Progress Bar with Colors:</h3>
       <div class="progress">
      <div class="progress-bar bg-dark"role="progressbar" style="width:45%" aria-valuemin="0"aria-valuemax="100" aria-valuenow="45"> </div>
      </div>
      <br><br>

       <h3>4. Progress Bar with animated striped :</h3>
       <div class="progress">
      <div class="progress-bar progress-bar-striped  progress-bar-animated bg-info"role="progressbar" style="width:45%" aria-valuemin="0"aria-valuemax="100" aria-valuenow="45"> </div>
</div>
</body>
</html>
