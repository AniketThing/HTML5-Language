<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <style type="text/css">
    h2{
        text-align: center;
        color: red;
    }
</style>
</head>
<body>
    <div class="container">
        <h2>Images In Bootstrap</h2>
    </div><br>
    <div class="container">
        <h3>1. Image Rounded</h3>
        <img src="Mumbai.jpg" class="rounded" alt="city" width="300px" height="300px">
        <br>
        <br>
        <h3>2. Image Circle</h3>
        <img src="Mumbai.jpg" class="rounded-circle" alt="city" width="300px" height="300px">
        <br>
        <br>
        <h3>3. Image Thumnaile</h3>
        <img src="Mumbai.jpg" class="img-thumbnail" alt="city" width="300px" height="300px">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
