<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <h1 class="text-center">Example of Border</h1>
    <div class="text-center">
        <button class="border-0">Click</button>
        <br>
        <br>
        <button class="border-3">Click</button>
         <br>
        <br>
        <button class="border-3 rounded border-danger bg-primary">Click</button>
        <br>
        <br>
         <button class="rounded-pill">Click</button
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
