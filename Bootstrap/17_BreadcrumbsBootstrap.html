<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example of Breadcrumbs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <style type="text/css">
        h1{
            text-align: center;
            color: palevioletred;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Example of Breadcrumbs</h1>
        <br><br><br>
        <nav area aria-label="Breadcrumbs">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Home</li>
                <li class="breadcrumb-item">Product</li>
                <li class="breadcrumb-item">Mobils</li>
                <li class="breadcrumb-item">Apple</li>
            </ol>
        </nav>
        <br><br><br>
        <nav area aria-label="Breadcrumbs">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Home</li>
                <li class="breadcrumb-item">Product</li>
                <li class="breadcrumb-item">Mobils</li>
                <li class="breadcrumb-item active">Apple</li>
            </ol>
        </nav>
        <br><br><br>
        <nav area aria-label="Breadcrumbs">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="#">Home</a></li>
                <li class="breadcrumb-item"><a href="#">Product</a></li>
                <li class="breadcrumb-item"><a href="#">Mobils</a></li>
                <li class="breadcrumb-item">Apple</li>
            </ol>
        </nav>
    </div>
</body>
</html>
