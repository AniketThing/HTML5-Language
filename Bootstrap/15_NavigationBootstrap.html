<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style type="text/css">
        h1{
            text-align: center;
            color:chocolate;
        }
        h3{
            color: palevioletred;
        }
    </style>
</head>
<body>
    <h1>Example of Navigations in Bootstrap</h1>
    <div class="container">

        <ul class="nav nav-tabs">
            <li class="nav-item"><a class="nav-link" href="#">HTML</a></li>
            <li class="nav-item"><a class="nav-link" href="#">CSS</a></li>

        </ul>
    </div>
    <br><br>
    <div class="container">
        <h3>2. Tab-pills Example</h3>
        <ul class="nav nav-pills">
            <li class="nav-item"><a class="nav-link" href="#">HTML</a></li>
            <li class="nav-item"><a class="nav-link" href="#">CSS</a></li>
            <li class="nav-item"><a class="nav-link" href="#">BOOTSTRAP</a></li>
            <li class="nav-item"><a class="nav-link" href="#">JAVASCRIPT</a></li>
            <li class="nav-item"><a class="nav-link" href="#">MYSQL</a></li>
