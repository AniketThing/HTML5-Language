<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style type="text/css">
        .Aniket{
            border: 1px solid lightslategray;
            border-radius: 10px;
            padding: 50px;
        }
       section{
            margin-top: 50px;
        }
        .amar{
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="Aniket">
           <div class="container-fluid">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-md-9 col-lg-6 col-xl-5">
                    <img src="Mumbai.jpg" class="img-fluid rounded-circle" alt="CITY">
                </div>
                <div class="col-md-8 col-lg-6 offset-xl-1">
                    <form>
                       <div class="d-flex flex-row align-items-center justify-content-center">
                                  <p class="lead fw-normal mb-0 me-3">Sign Up</p>
                                      <button class="btn btn-primary btn-floating mx-1">
                                      <i class="fab fa-facebook-f"></i>
                                      </button>
                                      <button class="btn btn-primary btn-floating mx-1">
                                      <i class="fab fa-twitter"></i>
                                      </button>
                                      <button class="btn btn-primary btn-floating mx-1">
                                     <i class="fab fa-linkedin-in"></i>
                                     </button>
                                     <button class="btn btn-primary btn-floating mx-1">
                                    <i class="fab fa-google"></i>
                                   </button>
                         </div>

                <div class="divider d-flex justify-content-center align-items-center my-4">
                       <p class="text-center fw-bold mx-3 mb-0">
                            Or
                        </p>

                </div>
                        <div class="form-outline mb-3 fw-bold">
                            <label class="form-label" for="ExampleEmail">Email Address</label>
                            <input type="email" id="ExampleEmail" class="form-control form-control-lg" placeholder="Enter Valid Email">
                        </div>
                        <div class="form-outline mb-3 fw-bold">
                            <label class="form-label" for="ExamplePassword">Email Password</label>
                            <input type="password" id="ExamplePassword" class="form-control form-control-lg" placeholder="Enter Valid Password">
                        </div>
                        <div class="d-flex justify-content-center align-items-center">
                            <div class="d-flex">
                                <input type="checkbox" class="form-check-input me-2" id="ExampleCheckbox">

                                <label class="form-check-label" for="ExampleCheckbox">
                                    Remember Me
                                </label>
                            </div>
                        </div>
                        <div class="text-center">
                            <a href="#" class="">Forgot Password</a>
                        </div>
                        <div class="mt-2 pt-2 text-center">
                            <button type="button" class="btn btn-primary btn-floating mx-1" style="padding-left:2.5rem;padding-right: 2.5rem; ">
                                Login
                            </button>
                            <p class="small fw-bold mt-2 pt-1 mb-0">Don't Have an Account?
                                <a href="#" class="m-1">Register</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
           </div>
           <br><br>
           <div class="d-flex flex-column flex-md-row text-center text-md-start justify-content-between py-4 px-4 px-xl-5 bg-success">
            <div class="text-white mb-3 mb-md-0">
                Copyright City.
            </div>
            <div>
                <a href="#" class="text-white me-1 text-decoration-none">
                <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#" class="text-white me-1 text-decoration-none">
                <i class="fab fa-twitter"></i>
                </a>
                <a href="#" class="text-white me-1 text-decoration-none">
                <i class="fab fa-linkedin-in"></i>
                </a>
                <a href="#" class="text-white me-1 text-decoration-none">
                <i class="fab fa-google"></i>
                </a>
            </div>
           </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
