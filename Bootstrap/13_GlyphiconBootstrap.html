<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glyphicon Example</title>
    <link rel="stylesheet"href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
     <style type="text/css">
        h2{
            color: palevioletred;
            text-align: center;
        }
     </style>
</head>
<body>
    <h2>Example of Glyphicons in Bootstrap</h2>
    <br>
    <br>
    <div class="container">
        <p>Icon in asterisk :&nbsp;<span class="glyphicon glyphicon-asterisk"></span></p>
        <br><br>
        <p>This Ex in button with Icon :&nbsp;<button class="btn btn-primary">Search &nbsp;<span class="glyphicon glyphicon-search"></span></button></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
