<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example of Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style type="text/css">
        h2{
            text-align: center;
            color: cadetblue;
        }
        .FixedTop{
            width: 100px;
            height: 100px;
            background-color: chartreuse;
            border: 1px solid black;
        }
        .FixedBottom{
            width: 100px;
            height: 100px;
            background-color: palevioletred;
            border: 1px solid black;
        }
        .StickyTop{
            padding: 20px;
            background-color:peru;
            border: 1px solid black;
            color: white;
            text-align: center;
            margin-top: 200px;
        }
    </style>
</head>
<body>
    <div>
        <h2>Example of Position in Bootstrap</h2>
    </div>
    <div class="fixed-top FixedTop">
        <p>This is Fixed Top</p>
    </div>
    <br>
    <div class="fixed-bottom FixedBottom">
        <p>This is Fixed Bottom</p>
    </div>
    <br>
    <div style="height: 800px;">
    <div class="sticky-top StickyTop">
        <p>This is Sticky Top</p>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
