<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style type="text/css">
        .container1{
            text-align: center;
            color: blueviolet;
        }
        .container{
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container1">
        <h2>This is Grid Bootstrap Example</h2>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-md-1">1</div>
            <div class="col-md-1">2</div>
            <div class="col-md-1">3</div>
            <div class="col-md-1">4</div>
            <div class="col-md-1">5</div>
            <div class="col-md-1">6</div>
            <div class="col-md-1">7</div>
            <div class="col-md-1">8</div>
            <div class="col-md-1">9</div>
            <div class="col-md-1">10</div>
            <div class="col-md-1">11</div>
            <div class="col-md-1">12</div>
        </div>
        <div class="row">
            <div class="col-md-6 bg-primary">1</div>
            <div class="col-md-6 bg-warning">2</div>
        </div>
        <div class="row">
            <div class="col-md-4 bg-primary">1</div>
            <div class="col-md-4 bg-warning">2</div>
            <div class="col-md-4 bg-info">3</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
