<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranges</title>
</head>
<body>
    <form action="/server">
        <fieldset>
            <legend><b><i>Rating the This BGM :</i></b></legend>
          <audio controls>
            <source src="Vaazhai BGM.mp3">
          </audio>
          <br>
          <br>
          <label for="range">Likes &#10084; :</label>
          <input type="range" min="0" max="100" step="10" name="range">
          </fieldset>
    </form>
    <br>
    <button type="submit">submit</button>
</body>
</html>
