<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>
</head>
<body>
    <svg height="200" width="400">
        <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:aqua;"/>
                <stop offset="100%" style="stop-color:lightgreen;"/>
            </linearGradient>
        </defs>
        <rect x="20" y="30" width="400" height="50" fill="url(#grad1)" />
        <text x="130" y="65" fill="black" font-size="30" font-weight="bold" stroke="gray">Hello , Aniket</text>
    </svg>
</body>
</html>
