<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Forms</title>
</head>
<body>
    <fieldset>
        <legend><b>Application Form :</b></legend>
        <br>
        <form action="34_HTMLSuccesfullySubmit.html">
             <label for="Name"><i>First Name :</i></label>
             <input type="text" id="Name" name="First name" required autofocus> &nbsp; &nbsp;
             <label for="Surname"><i>Last Name :</i></label>
             <input type="text" id="Surname" name="Last Name" required autofocus>
             <br>
             <br>
             <label for="DOB"><i>Date of birth :</i></label>
             <input type="date" id="DOB" name="DOB"> &nbsp; &nbsp;
             <label for="Age"><i>Age</i></label>
             <input for="Age" id="Age" name="Age" min="0">
             <br>
             <br>
             <label for="Gender"><i>Gender :</i></label>
             <select id="Gender" name="Gender">
                 <option value="Male">Male</option>
                 <option value="Feamale">Female</option>
                 <option value="Other">Other</option>
             </select>
             <br>
             <br>
             <label for="Email"><i>Email Address :</i></label>
             <input type="email" id="email" name="email">
             <br>
             <br>
             <label><i>Position Available :</i></label>
             <input type="radio" name="Position" value="junior">
             Junior Developer &nbsp;
             <input type="radio" name="Position" value="mid">
             Mid-level Developer &nbsp;
             <input type="radio" name="Position" value="senior">
             Senior Developer
             <br>
             <br>
             <label><i>Programming Languages :</i></label>
             <input type="checkbox" name="Languages" value="HTML">
             HTML &nbsp;
             <input type="checkbox" name="Languages" value="CSS">
             CSS  &nbsp;
             <input type="checkbox" name="Languages" value="Javascript">
             Javascript  &nbsp;
             <input type="checkbox" name="Languages" value="php">
             php &nbsp;
             <br>
             <br>
             <label><i>Passwords :</i></label>
             <input type="password" name="password" id="password"> &nbsp; &nbsp;
             <label><i>Confirm Passwords :</i></label>
             <input type="password" name="password" id="password">
             <br>
             <br>
             <button type="submit">submit</button> &nbsp;
             <button type="reset">Reset</button>
        </form>
    </fieldset>
</body>
</html>
