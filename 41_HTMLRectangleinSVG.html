<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle SVG</title>
</head>
<body>
    <p><b>This is Rectangle1 :</b></p>
    <svg>
        <rect x="30" y="30" width="100" height="40" fill="skyblue">
    </svg>
    <br>
    <br>
    <p><b>This is Rectangle2 :</b></p>
    <svg>
        <rect x="30" y="30" width="100" height="40" fill="skyblue" stroke="black">
    </svg>
    <br>
    <br>
    <p><b>This is Rectangle3 :</b></p>
    <svg>
        <rect x="30" y="30" width="100" height="40" fill="skyblue" stroke="black" stroke-width="2">
    </svg>
    <br>
    <br>
    <p><b>This is Rectangle4 :</b></p>
    <svg>
        <rect x="30" y="30" width="100" height="40" fill="skyblue" stroke="black" stroke-width="2" stroke-dasharray="12,5">
    </svg>
</body>
</html>
