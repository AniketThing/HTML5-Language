<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Target Attribute</title>
</head>
<body>
    <h4>This is Social Media Links :</h4>
    <ol>
        <li><a href="https://www.instagram.com/" target="_self">Instagram</a></li>
        <li><a href="https://www.whatsapp.com/" target="_blank">Whatapps</a></li>
        <li><a href="https://in.linkedin.com/" target="_parent">Linkedin</a></li>
        <li><a href="https://www.snapchat.com/" target="_top">Snapchat</a></li>
    </ol>
</body>
</html>
</body>
</html>
